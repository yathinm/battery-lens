name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Test core packages
        run: swift test
      - name: Build application
        run: >-
          xcodebuild
          -project BatteryLens.xcodeproj
          -scheme BatteryLens
          -configuration Debug
          -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Test application
        run: >-
          xcodebuild
          -project BatteryLens.xcodeproj
          -scheme BatteryLens
          -configuration Debug
          -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=NO
          test
